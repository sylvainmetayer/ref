# Liens de parrainage morts et offres expirées : une issue récapitulative, mise à jour
# d'une semaine sur l'autre tant qu'elle est ouverte. Rien si tout va bien.
name: Contrôle hebdomadaire

on:
  schedule:
    - cron: "17 6 * * 1" # lundi matin
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/controle-hebdo.js > rapport.md
      - name: Issue récapitulative
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Contrôle hebdomadaire des liens et des offres
        run: |
          if [ ! -s rapport.md ]; then echo "Rien à signaler"; exit 0; fi
          printf '\n_Généré par [ce workflow](%s/%s/actions/runs/%s)._\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> rapport.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file rapport.md
          else
            gh issue create --title "$TITLE" --body-file rapport.md
          fi
